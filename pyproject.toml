[project]
name = "pixel"
version = "0.1.0"
description = "Controls Windows apps through the accessibility tree"
requires-python = ">=3.11"
dependencies = [
    "pywinauto==0.6.9",
]

[project.scripts]
pixel = "pixel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
