# PIXEL configuration. Model names live here and nowhere in code.

[models]
# Tried in order on every step. Any model error moves the same step to the next
# provider; rate limits, "high demand", bad keys and unknown models skip that
# provider for the rest of the run. Names are keys of [models.providers.*].
chain = ["gemini-lite", "groq", "ollama"]
# Nov 21-22, 2026: gemini-3.8-flash (5/5 timeouts or "high demand") and
# gemini-3.7-flash (5/5 "high demand") never answered a trial, so they are not
# in the chain. Add "gemini-38" or "gemini-37" back to try them.

# model: the llm model id. options: passed to the model unchanged.
# timeout: seconds per model call.
[models.providers.gemini-lite]
model = "gemini-3.5-flash-lite"
timeout = 20                 # calls take about 0.7 s
options = { thinking_level = "minimal", temperature = 0 }   # lowest thinking the plugin offers

# OpenAI-compatible endpoints (api_base) go through llm's built-in client.
# key: the llm key alias (llm keys set groq) or env var GROQ_API_KEY.
# Nov 22, 2026: llama-3.3-70b-versatile is gone from Groq (404). Models this key can
# use with tool calls: openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.8-27b.
[models.providers.groq]
model = "openai/gpt-oss-120b"
api_base = "https://api.groq.com/openai/v1"
key = "groq"
reasoning = true             # enables the reasoning_effort option
timeout = 30
options = { reasoning_effort = "low", temperature = 0 }

[models.providers.ollama]
model = "qwen2.5:7b"
api_base = "http://127.0.0.1:11434/v1"   # not localhost: that took 4-6 s to fail with Ollama off
local = true                 # runs on this machine; no key
timeout = 120                # the first call loads the model onto the GPU
options = { temperature = 0 }

[models.providers.gemini-37]
model = "gemini-3.7-flash"
timeout = 60
options = { thinking_level = "low", temperature = 0 }

[models.providers.gemini-38]
model = "gemini-3.8-flash"
timeout = 60                 # replies have taken up to ~30 s
options = { thinking_level = "low", temperature = 0 }   # thinking can't be turned off

[log]
path = '%LOCALAPPDATA%\pixel\pixel.db'   # outside OneDrive: it holds screen text
store_tree = true                        # false: keep run and step rows but no tree text

[run]
step_cap = 15             # --max-steps can only lower this
history_steps = 8         # recent steps shown to the model
max_rejected = 3          # invalid tool calls in a row before the run stops
confirm = true            # ask before each action; --no-confirm turns it off
# Only these apps' windows are ever read during a run and sent to the model.
cloud_apps = ["notepad"]
kill_hotkey = "ctrl+alt+q"
settle_initial = 0.2      # seconds before the first settle read
settle_interval = 0.15    # seconds between settle reads
settle_timeout = 3.0      # give up waiting for two identical reads after this

[bridge]
max_depth = 12        # raw UIA levels walked below the window
max_elements = 120    # lines kept per read (interactive + context)
chars_per_token = 2.5 # token estimate divisor; measured 2.4 to 2.6 on gemini-3.8-flash (M2)

# open_app only launches or focuses apps listed here.
# exe: what gets launched (env vars like %LOCALAPPDATA% are expanded).
# process: the executable name used to find an existing window.
[apps.notepad]
exe = "notepad.exe"
process = "notepad.exe"

[apps.chrome]
exe = "chrome.exe"
process = "chrome.exe"

[apps.claude]
# Store (MSIX) package: launched by app ID, since its folder changes with each update.
exe = "shell:AppsFolder\\Claude_pzs8sxrjxfjjc!Claude"
process = "claude.exe"
